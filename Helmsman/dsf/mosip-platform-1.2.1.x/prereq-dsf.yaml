helmDefaults:
  tillerNamespace: kube-system
  tillerless: true
  install: true

helmRepos:
  bitnami: https://charts.bitnami.com/bitnami
  mosip: https://mosip.github.io/mosip-helm
  banzaicloud-stable: https://charts.helm.sh/stable
  grafana: https://grafana.github.io/helm-charts
  grafana-community: https://grafana-community.github.io/helm-charts
  prometheus-community: https://prometheus-community.github.io/helm-charts

# Note: Based on your requirement disable the namespaces which you want to use, by default all the namespaces are protected.
namespaces:
  kube-system:
    protected: true
  monitoring:
    protected: true
  # rancher-monitoring / rancher-logging are replaced by the standalone
  # kube-prometheus-stack (monitoring) and Loki + Grafana + Alloy (logging) stacks.
  istio-system:
    protected: true
  istio-operator:
    protected: true
  httpbin:
    protected: true
  logging:
    protected: true

apps:
  kube-prometheus-stack:
    namespace: monitoring
    enabled: true
    version: 88.6.2
    chart: prometheus-community/kube-prometheus-stack
    valuesFile: "$WORKDIR/utils/prometheus-values.yaml"
    wait: true
    timeout: 900
    priority: -6
    hooks:
      # Applies the CRDs of this chart version and creates/updates the SMTP
      # secret (SMTP_PASSWORD is read from the env). Keep the version argument
      # in sync with `version` above.
      preInstall: "$WORKDIR/hooks/monitoring-preinstall.sh 88.6.2"
      preUpgrade: "$WORKDIR/hooks/monitoring-preinstall.sh 88.6.2"
      postInstall: "$WORKDIR/hooks/install-istio-and-httpbin.sh ${domain_name} ${env_name}"
      postUpgrade: "$WORKDIR/hooks/install-istio-and-httpbin.sh ${domain_name} ${env_name}"

  loki:
    namespace: logging
    enabled: true
    version: 6.55.0
    chart: grafana/loki
    valuesFile: "$WORKDIR/utils/loki-values.yaml"
    wait: true
    priority: -4
    timeout: 300

  grafana:
    namespace: logging
    enabled: true
    version: 12.11.2
    chart: grafana-community/grafana
    valuesFile: "$WORKDIR/utils/grafana-values.yaml"
    wait: true
    priority: -3
    timeout: 300
    hooks:
      # grafana-admin secret (admin.existingSecret) from GRAFANA_ADMIN_PASSWORD
      preInstall: "$WORKDIR/hooks/grafana-preinstall.sh"
      preUpgrade: "$WORKDIR/hooks/grafana-preinstall.sh"
      # (re)apply dashboard ConfigMaps so dashboard changes reach existing envs
      postInstall: "$WORKDIR/hooks/import-dashboards.sh"
      postUpgrade: "$WORKDIR/hooks/import-dashboards.sh"

  alloy:
    namespace: logging
    enabled: true
    version: 1.6.2
    chart: grafana/alloy
    valuesFile: "$WORKDIR/utils/alloy-values.yaml"
    wait: true
    priority: -2
    timeout: 300

  istio-addons-loki:
    namespace: logging
    enabled: true
    version: 1.0.0
    chart: mosip/istio-addons
    set:
      istio.name: "grafana"
      istio.host: "grafana.${domain_name}"
      istio.ingressController: "ingressgateway-internal"
      istio.port.name: "grafana"
      istio.port.number: "80"
      istio.port.protocol: "HTTP"
      istio.serviceHost: "grafana"
      istio.servicePort: "80"
    wait: true
    priority: -1
